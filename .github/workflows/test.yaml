name: Build Project with epiclang

on:
  push:
  pull_request:

jobs:
  check_compilation_and_coding_style:
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Project
        run: |
          make
          if [ ! -f ./my_world ]; then
            echo "::error::Binary 'my_world' not found."
            exit 1
          fi

          echo "Checking coding style..."
          find ./src -name '*.c' -o -name '*.h' | xargs epicheck
          if [ $? -ne 0 ]; then
            echo "::error::Coding style errors detected."
            exit 1
          fi
