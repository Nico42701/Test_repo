name: Build Project with epiclang

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test inside epiclang Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/src \
            -w /src \
            epitechcontent/epitest-docker:latest \
            sh -c "make"