name: Build Project with epiclang

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & test in Epitech Docker
        timeout-minutes: 2
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/home/epitech \
            -w /home/epitech \
            epitechcontent/epitest-docker:latest \
            sh -c "make && ./my_tests"