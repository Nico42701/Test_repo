name: Build Project with epiclang

on:
  push:
  pull_request:

jobs:
  check_compilation_and_coding_style:
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker:latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Project and Check Coding Style
        timeout-minutes: 2
        run: |
          make

          if [ ! -f ./my_tests ]; then
            echo "❌ Error: Binary 'my_tests' not found. Check your Makefile."
            ls -R
            exit 1
          fi

          echo "🔎 Checking coding style..."
          find . -type f -name "*.c" -exec epiclang {} +

          if [ $? -ne 0 ]; then
            echo "❌ Coding style errors detected."
            exit 1
          fi
      
      - name: Run Tests
        run: ./my_tests
