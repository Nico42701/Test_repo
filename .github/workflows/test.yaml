name: Build Project with epiclang

on:
  push:
  pull_request:

jobs:
  check_compilation_and_coding_style:
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with script
        run: |
          chmod +x ./build.sh
          ./build.sh --tag latest -n
          
          if [ $? -ne 0 ]; then
            echo "::error::Build script failed."
            exit 84
          fi

      - name: Build Project
        run: |
          make
          if [ ! -f ./my_world ]; then
            echo "::error::Binary 'my_world' not found."
            exit 84
          fi
