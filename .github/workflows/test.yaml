name: Build Project with epiclang

on:
  push:
  pull_request:

jobs:
  check_compilation_and_coding_style:
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checking coding style
        run: |
          make CC=epiclang > epiclang_report.log 2>&1
          grep -v '^epiclang' epiclang_report.log > filtered.log || true

          if [ -s filtered.log ]; then
            echo "Found coding style warnings, generating GitHub annotations..."

            while IFS= read -r line; do
              file=$(echo "$line" | cut -d':' -f1)
              line_number=$(echo "$line" | cut -d':' -f2)
              type=$(echo "$line" | grep -oP '\[Minor\]|\[Major\]|\[Info\]' | tr -d '[]')
              code=$(echo "$line" | grep -oP '\(C-[A-Z0-9]+\)' | tr -d '()')
              message=$(echo "$line" | sed -E 's/.*\] (.*) \(.*/\1/')

              if [ "$type" = "Major" ]; then
                echo "::error file=$file,line=$line_number,title=$code::$message"
              elif [ "$type" = "Minor" ]; then
                echo "::warning file=$file,line=$line_number,title=$code::$message"
              else
                echo "::notice file=$file,line=$line_number,title=$code::$message"
              fi
            done < filtered.log

            exit 84
          fi

      - name: Build Project
        run: |
          make
          if [ ! -f ./my_test ]; then
            echo "::error::Binary 'my_test' not found."
            exit 84
          fi

      - name: Exec Project
        run: ./my_test
