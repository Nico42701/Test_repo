name: Build Project with epiclang

on:
  push:
  pull_request:

jobs:
  check_compilation_and_coding_style:
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker:latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Project
        run: |
          make
          if [ ! -f ./my_world ]; then
            echo "::error::Binary 'my_world' not found."
            exit 1
          fi

      - name: Check Coding Style
        run: |
          # On capture stdout ET stderr
          OUTPUT=$(find . -type f -name "*.c" -exec epiclang {} + 2>&1)
          
          if [ -n "$OUTPUT" ]; then
            echo "$OUTPUT"
            echo "---------------------------------------"
            echo "❌ Coding style errors detected."
            exit 1
          else
            echo "✅ Coding style is clean!"
          fi

