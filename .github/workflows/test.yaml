name: Build Project with epiclang

on:
  push:
  pull_request:

jobs:
  check_compilation_and_coding_style:
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checking coding style
        run: |
          make CC=epiclang > epiclang_report.log 2>&1
          grep '\[Banana\]' epiclang_report.log | grep -v '^epiclang' > filtered.log || true

          if [ -s filtered.log ]; then
            # 1. On découpe le fichier en petits fichiers de 10 lignes (prefixe: group_)
            split -l 10 filtered.log group_
            
            # 2. On boucle sur chaque groupe créé
            for group_file in group_*; do
              # On crée un groupe repliable dans les logs GitHub pour la lisibilité
              echo "::group::Coding Style Errors ($group_file)"
              
              while IFS= read -r line; do
                type=$(echo "$line" | grep -oP '\[Minor\]|\[Major\]|\[Info\]|\[Fatal\]' | tr -d '[]')
                file=$(echo "$line" | cut -d':' -f1)
                line_number=$(echo "$line" | cut -d':' -f2)
                code=$(echo "$line" | grep -oP '\(C-[A-Z0-9]+\)' | tr -d '()')
                message=$(echo "$line" | sed -E 's/.*\] (.*) \(.*/\1/')
                
                # GitHub affichera ces 10 erreurs car elles sont isolées logiquement
                echo "::error file=$file,line=$line_number::$code - $message"
              done < "$group_file"
              
              echo "::endgroup::"
            done

            exit 84
          fi
      
      - name: Build Project
        run: |
          make
          if [ ! -f ./my_test ]; then
            echo "::error::Binary 'my_test' not found."
            exit 84
          fi

      - name: Exec Project
        run: ./my_test
