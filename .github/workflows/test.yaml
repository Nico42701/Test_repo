name: Build Project with epiclang

on:
  push:
  pull_request:

jobs:
  check_compilation_and_coding_style:
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker:latest
    
    env:
      CC: epiclang
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Coding Style Check
        run: tree -a

      - name: Build Project
        run: |
          make
          if [ ! -f ./my_world ]; then
            echo "::error::Binary 'my_world' not found."
            exit 1
          fi
