name: chocolatine

on:
  push:
    branches-ignore:
      - 'no-ga/**'
  pull_request:
    branches-ignore:
      - 'no-ga/**'

env:
  MIRROR_SSH_URL: "git@github.com:EpitechRepo/mirror.git"
  EXECUTABLES: "my_test"

jobs:
  check_compilation_and_coding_style:
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker:latest

    if: github.repository != 'EpitechRepo/mirror' 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile project with epiclang
        run: make CC=epiclang > epiclang_report.log 2>&1
        timeout-minutes: 2

      - name: Checking coding style
        run: |
          grep '\[Banana\]' epiclang_report.log | grep -v '^epiclang' > filtered.log || true
          if [ -s filtered.log ]; then
            cat filtered.log
            echo "::error::Too many Codding Style"
            exit 84
          fi

      - name: Clean file
        run: make clean

      - name: Verify Executables
        run: |
          if [ ! -x $EXECUTABLES ]; then
            echo "::error::File not found or executable"
            exit 84
  
  run_tests:
    needs: check_compilation_and_coding_style
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker:latest

    if: github.repository != 'EpitechRepo/mirror'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: run_tests
        run: make tests_run
        timeout-minutes: 2
      
      - name: run fclean
        run: make fclean
  
  push_to_mirror:
    needs: run_tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Mirror
        run: echo "OK!"
