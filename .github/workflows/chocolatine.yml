# Le dépôt Epitech est EpitechPGE1-2025/G-DOP-200-RUN-2-1-chocolatine-16
# Le dépôt Check est git@github.com:EpitechPGE1-2025/G-DOP-200-RUN-2-1-chocolatine-16.git

name: chocolatine

on:
  push:
    branches-ignore:
      - 'no-ga/**'
  pull_request:
    branches-ignore:
      - 'no-ga/**'

env:
  MIRROR_SSH_URL: "git@github.com:EpitechPGE1-2025/G-DOP-200-RUN-2-1-chocolatine-16.git"
  EXECUTABLES: "my_test"

jobs:
  check_compilation_and_coding_style:
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker:latest

    steps:
      - name: tests
        run: |
          echo "git@github.com:${{ github.repository }}.git"
          echo "${{ env.MIRROR_SSH_URL }}"


      - name: Check Repository Identity
        run: |
          if [ "git@github.com:${{ github.repository }}.git" = "${{ env.MIRROR_SSH_URL }}" ]; then
            echo "::error::Ce workflow ne doit pas s'exécuter sur le dépôt miroir."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile project with epiclang
        run: make CC=epiclang > epiclang_report.log 2>&1
        timeout-minutes: 2

      - name: Checking coding style
        run: |
          grep '\[Banana\]' epiclang_report.log | grep -v '^epiclang' > filtered.log || true
          if [ -s filtered.log ]; then
            cat filtered.log
            echo "::error::Too many Codding Style"
            exit 84
          fi

      - name: Clean file
        run: make clean

      - name: Verify Executables
        run: |
          if [ ! -x $EXECUTABLES ]; then
            echo "::error::File not found or executable"
            exit 84
          fi

  run_tests:
    needs: check_compilation_and_coding_style
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: run_tests
        run: make tests_run
        timeout-minutes: 2

      - name: run fclean
        run: make fclean

  push_to_mirror:
    needs: run_tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Mirror
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ env.MIRROR_SSH_URL }}
          ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}
